{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}
{% block page_title %}Reset Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-header">
        <div class="icon">🔑</div>
        <span data-ta="கடவுச்சொல் மாற்று" data-en="Change Password">Change Password</span>
      </div>
      <div class="card-body">
        <form method="POST">
          <div class="mb-3">
            <label class="form-label" data-ta="தற்போதைய கடவுச்சொல்" data-en="Current Password">Current Password</label>
            <input type="password" name="current_password" class="form-control" required>
          </div>
          <div class="mb-4">
            <label class="form-label" data-ta="புதிய கடவுச்சொல்" data-en="New Password">New Password</label>
            <input type="password" name="new_password" class="form-control" required>
          </div>
          <button type="submit" class="btn-green">
            <i class="bi bi-check-lg"></i>
            <span data-ta="புதுப்பி" data-en="Update Password">Update Password</span>
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
