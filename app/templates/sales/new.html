{% extends 'base.html' %}
{% block title %}New Sale{% endblock %}
{% block page_title %}<span data-ta="புதிய விற்பனை" data-en="New Sale">New Sale</span>{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card">
      <div class="card-header"><div class="icon">🛒</div> <span data-ta="புதிய விற்பனை" data-en="New Sale">New Sale</span> — {{ farm.name }}</div>
      <div class="card-body text-center py-4">
        <div style="font-size:3rem;margin-bottom:12px">🐔</div>
        <p class="text-muted mb-4">A new Sale ID will be generated automatically.<br>You can save as draft and continue later.</p>
        <form method="POST">
          <button type="submit" class="btn-green" style="padding:11px 28px;font-size:1rem">
            <i class="bi bi-plus-circle"></i>
            <span data-ta="விற்பனை தொடங்கு" data-en="Start New Sale">Start New Sale</span>
          </button>
        </form>
        <div class="mt-3">
          <a href="{{ url_for('sales.index', farm_id=farm.id) }}" class="btn-outline-green">
            <i class="bi bi-arrow-left"></i> <span data-ta="பின்னால் செல்" data-en="Back">Back</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
